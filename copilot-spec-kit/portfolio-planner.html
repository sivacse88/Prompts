<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16232E;
    --ink-2:#3A5162;
    --mute:#6B7A85;
    --page:#EDF1F3;
    --surface:#FFFFFF;
    --rule:#CBD6DD;
    --hair:#E4EBEF;
    --band-a:#E8EEF2;
    --band-b:#DDE7EC;
    --input:#FFF6D6;
    --s-none:#B9C4CC;
    --s-track:#2E8B57;
    --s-risk:#E0A526;
    --s-off:#C0392B;
    --s-done:#5B7C99;
    --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
    --wk:26px;
    --lead:220px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans);
    background:var(--page);
    color:var(--ink);
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1600px;margin:0 auto;padding:20px 16px 80px}

  /* ---------- masthead ---------- */
  .masthead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
  .title{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.01em;border:0;background:transparent;color:var(--ink);width:min(460px,100%);padding:2px 4px;border-radius:3px}
  .title:hover{background:var(--input)}
  .title:focus{outline:2px solid var(--ink);background:var(--surface)}
  .sub{color:var(--mute);font-size:13px;margin-top:2px}
  .sub input[type=date]{font-family:var(--sans);font-size:13px;border:1px solid var(--rule);background:var(--surface);border-radius:3px;padding:2px 5px;color:var(--ink)}

  .toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  button{font-family:var(--sans);font-size:13px;cursor:pointer}
  .btn{background:var(--surface);border:1px solid var(--rule);color:var(--ink);padding:6px 11px;border-radius:3px}
  .btn:hover{border-color:var(--ink-2)}
  .btn:focus-visible,.tab:focus-visible,.title:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.primary:hover{background:#0D1920}

  /* ---------- controls ---------- */
  .controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
    background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:8px 10px;margin-bottom:12px}
  .tabs{display:flex;gap:2px}
  .tab{background:transparent;border:1px solid transparent;padding:5px 13px;border-radius:3px;color:var(--ink-2);font-weight:500}
  .tab[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tab:hover:not([aria-pressed=true]){background:var(--band-a)}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  select,.txt{font-family:var(--sans);font-size:13px;padding:5px 7px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink)}
  .fl{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:12px}

  /* ---------- plan grid ---------- */
  .panel{background:var(--surface);border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin-bottom:16px}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--rule)}
  .panel-head h2{font-size:14px;font-weight:600;margin:0}
  .panel-head p{margin:0;font-size:12px;color:var(--mute)}
  .scroller{overflow-x:auto;overflow-y:visible}
  table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed}
  table.grid th,table.grid td{padding:0;margin:0}
  .stick{position:sticky;left:0;z-index:3;background:var(--surface);width:var(--lead);min-width:var(--lead);max-width:var(--lead);
    border-right:1px solid var(--rule);padding:5px 9px;text-align:left;vertical-align:middle}
  thead .stick{z-index:5;background:var(--ink);color:#fff}
  .wkcell{width:var(--wk);min-width:var(--wk);max-width:var(--wk)}
  thead th.wkcell{background:var(--ink);color:#fff;font-size:10px;font-weight:500;text-align:center;height:24px;border-left:1px solid #263945}
  thead tr.qband th{background:var(--band-a);color:var(--ink);font-size:12px;font-weight:600;text-align:center;height:22px;border-left:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  thead tr.qband th.alt{background:var(--band-b)}
  thead tr.qband th.stick{background:var(--surface);color:var(--mute);font-weight:500;font-size:11px}
  tbody td.wkcell{border-left:1px solid var(--hair);border-bottom:1px solid var(--hair);height:34px}
  tbody tr:hover td.wkcell{background:#F7FAFB}
  tbody tr:hover .stick{background:#F7FAFB}
  .stick .pname{font-size:13px;font-weight:500;line-height:1.25;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stick .pmeta{font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .rowbtn{display:block;width:100%;text-align:left;background:transparent;border:0;padding:0;cursor:pointer;font-family:var(--sans)}
  .barwrap{position:relative;border-bottom:1px solid var(--hair);
    background-image:linear-gradient(to right,var(--hair) 1px,transparent 1px);
    background-size:var(--wk) 100%}
  tbody tr:hover .barwrap{background-color:#F7FAFB}
  table.grid{width:max-content}
  .bar{position:absolute;height:18px;touch-action:none;top:8px;border-radius:2px;cursor:grab;display:flex;align-items:center;
    box-shadow:inset 0 -1px 0 rgba(0,0,0,.12)}
  .bar:active{cursor:grabbing}
  .bar .fillpct{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.34);border-right:1px solid rgba(255,255,255,.6)}
  .bar .lbl{position:relative;font-size:10px;color:#fff;padding:0 5px;white-space:nowrap;overflow:hidden;font-weight:500}
  .handle{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize}
  .handle.l{left:-3px}.handle.r{right:-3px}
  .bar:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .today{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--ink);z-index:2;pointer-events:none}
  .todayflag{position:absolute;top:-1px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:9px;padding:1px 4px;border-radius:2px;z-index:6;pointer-events:none;white-space:nowrap}
  .empty{padding:26px 14px;color:var(--mute);font-size:13px}

  /* ---------- people ---------- */
  .load{width:100%;height:34px;font-size:10px;display:flex;align-items:center;justify-content:center;color:transparent}
  .l1{background:#CDE7D8}
  .l2{background:var(--s-risk);color:#fff}
  .l3{background:var(--s-off);color:#fff}
  .pcount{font-size:11px;color:var(--mute)}

  /* ---------- legend / footer ---------- */
  .legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:9px 12px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-2)}
  .chip{display:inline-flex;align-items:center;gap:6px}
  .sw{width:16px;height:10px;border-radius:2px;display:inline-block}
  .stats{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:16px}
  .stat{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:9px 14px;min-width:104px}
  .stat b{display:block;font-size:22px;font-weight:600;line-height:1.1}
  .stat span{font-size:11px;color:var(--mute)}

  /* ---------- editor drawer ---------- */
  .scrim{position:fixed;inset:0;background:rgba(22,35,46,.34);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:20}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--rule);
    transform:translateX(100%);transition:transform .2s ease;z-index:21;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .drawer header{padding:14px 16px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center}
  .drawer header h3{margin:0;font-size:15px;font-weight:600}
  .drawer .body{padding:14px 16px;overflow-y:auto;flex:1}
  .drawer footer{padding:12px 16px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:space-between}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:3px;font-weight:500}
  .field input[type=text],.field input[type=number],.field textarea,.field select{
    width:100%;font-family:var(--sans);font-size:13px;padding:6px 8px;border:1px solid var(--rule);border-radius:3px;background:var(--input);color:var(--ink)}
  .field textarea{resize:vertical;min-height:56px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .people-pick{display:flex;flex-wrap:wrap;gap:6px}
  .pick{border:1px solid var(--rule);background:var(--surface);border-radius:14px;padding:4px 10px;font-size:12px;color:var(--ink-2)}
  .pick[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .danger{color:var(--s-off);background:transparent;border:1px solid var(--rule);padding:6px 11px;border-radius:3px}
  .danger:hover{border-color:var(--s-off)}
  .hint{font-size:11px;color:var(--mute);margin-top:-6px;margin-bottom:12px}

  @media (max-width:640px){
    :root{--lead:150px;--wk:22px}
    .wrap{padding:14px 10px 70px}
    .title{font-size:21px}
    .controls{gap:8px}
    .stats{gap:8px}
    .stat{flex:1;min-width:78px;padding:7px 10px}
    .stat b{font-size:18px}
  }
  @media print{
    body{background:#fff}
    .toolbar,.controls .filters,.drawer,.scrim{display:none}
    .panel{break-inside:avoid;border-color:#999}
  }
  @media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
</style>

<div class="wrap">
  <div class="masthead">
    <div>
      <input class="title" id="planTitle" value="Engineering Portfolio 2026-27" aria-label="Plan title">
      <div class="sub">52 weeks from <input type="date" id="startDate" value="2026-09-07" aria-label="First Monday of the plan"> &nbsp;·&nbsp; <span id="rangeLbl"></span></div>
    </div>
    <div class="toolbar">
      <button class="btn primary" id="addBtn">Add project</button>
      <button class="btn" id="exportBtn">Save plan</button>
      <button class="btn" id="importBtn">Open plan</button>
      <button class="btn" id="csvBtn">Export CSV</button>
      <button class="btn" id="printBtn">Print</button>
      <input type="file" id="fileIn" accept="application/json" hidden>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <div class="tabs" id="tabs"></div>
    <div class="filters">
      <span class="fl">Program <select id="fProgram"></select></span>
      <span class="fl">Status <select id="fStatus"></select></span>
      <span class="fl">Person <select id="fPerson"></select></span>
      <input class="txt" id="fSearch" placeholder="Find a project" aria-label="Find a project" size="14">
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Projects</h2>
      <p>Drag a bar to move it, drag its edges to change the dates, click the name to edit.</p>
    </div>
    <div class="scroller" id="planScroll"><div id="planGrid"></div></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>People</h2>
      <p>How many projects each person is on, week by week.</p>
    </div>
    <div class="scroller" id="peopleScroll"><div id="peopleGrid"></div></div>
    <div class="legend">
      <span class="chip"><i class="sw" style="background:#CDE7D8"></i>One project</span>
      <span class="chip"><i class="sw" style="background:var(--s-risk)"></i>Two at once</span>
      <span class="chip"><i class="sw" style="background:var(--s-off)"></i>Three or more</span>
      <span class="chip" style="color:var(--mute)">Add or rename people in the project editor.</span>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <header>
    <h3 id="drawerTitle">Edit project</h3>
    <button class="btn" id="closeDrawer" aria-label="Close">Close</button>
  </header>
  <div class="body">
    <div class="field"><label for="eName">Project</label><input type="text" id="eName"></div>
    <div class="two">
      <div class="field"><label for="eProgram">Program</label>
        <select id="eProgram"></select></div>
      <div class="field"><label for="eStatus">Status</label>
        <select id="eStatus"></select></div>
    </div>
    <div class="field"><label for="eLead">Lead</label><select id="eLead"></select></div>
    <div class="field"><label>Team</label><div class="people-pick" id="eTeam"></div></div>
    <div class="field"><label for="eNewPerson">Add someone new</label>
      <input type="text" id="eNewPerson" placeholder="Name, then Enter"></div>
    <div class="two">
      <div class="field"><label for="eStart">Start week</label><input type="number" id="eStart" min="1" max="52"></div>
      <div class="field"><label for="eEnd">End week</label><input type="number" id="eEnd" min="1" max="52"></div>
    </div>
    <p class="hint" id="dateHint"></p>
    <div class="two">
      <div class="field"><label for="ePct">Percent done</label><input type="number" id="ePct" min="0" max="100" step="5"></div>
      <div class="field"><label for="eFte">FTE</label><input type="number" id="eFte" min="0" max="20" step="0.5"></div>
    </div>
    <div class="field"><label for="eNotes">Notes</label><textarea id="eNotes"></textarea></div>
  </div>
  <footer>
    <button class="danger" id="deleteBtn">Delete project</button>
    <button class="btn primary" id="saveBtn">Save changes</button>
  </footer>
</aside>

<script>
(function(){
  "use strict";
  var WEEKS = 52;
  var STATUSES = [
    {k:"Not started", c:"var(--s-none)"},
    {k:"On track",    c:"var(--s-track)"},
    {k:"At risk",     c:"var(--s-risk)"},
    {k:"Off track",   c:"var(--s-off)"},
    {k:"Complete",    c:"var(--s-done)"}
  ];
  var PROGRAMS = ["Modernization","Regulatory","Growth","Platform / infra","Run the business"];

  var state = {
    title: "Engineering Portfolio 2026-27",
    start: "2026-09-07",
    view: "year",
    people: ["Priya Nathan","Marcus Bell","Dana Okafor","Ravi Menon","Ellen Vargas","Tom Whitfield","Grace Lin","Omar Haddad"],
    projects: [
      {id:1,name:"RepApp modernization - remaining 55%",program:"Modernization",lead:"Priya Nathan",
       team:["Priya Nathan","Marcus Bell","Dana Okafor","Tom Whitfield"],status:"At risk",start:1,end:26,pct:45,fte:4,
       notes:"Strangler migration to Angular. Scope cut to check contribution first."},
      {id:2,name:"RepApp backend API hardening",program:"Modernization",lead:"Marcus Bell",
       team:["Marcus Bell","Ravi Menon"],status:"On track",start:1,end:13,pct:60,fte:2,
       notes:"Original owner left. Rebuild API knowledge and documentation."},
      {id:3,name:"Application portfolio dashboard",program:"Run the business",lead:"Dana Okafor",
       team:["Dana Okafor","Ellen Vargas"],status:"On track",start:3,end:11,pct:70,fte:1.5,
       notes:"Excel inventory feeding a Power BI view for the manager group."},
      {id:4,name:"Rep chat assistant - discovery",program:"Growth",lead:"Grace Lin",
       team:["Grace Lin","Omar Haddad"],status:"Not started",start:15,end:31,pct:0,fte:1,
       notes:"Ontology layer and in-app chat for donor flows."},
      {id:5,name:"Quality gate remediation",program:"Platform / infra",lead:"Tom Whitfield",
       team:["Tom Whitfield","Ravi Menon"],status:"On track",start:1,end:21,pct:30,fte:1,
       notes:"Sonar findings and CI/CD build stability."},
      {id:6,name:"Sample row - replace with your own",program:"Regulatory",lead:"Ellen Vargas",
       team:["Ellen Vargas","Omar Haddad"],status:"Complete",start:1,end:7,pct:100,fte:0.5,
       notes:"Shows the shape the planner expects."}
    ],
    nextId: 7
  };

  var $ = function(id){ return document.getElementById(id); };
  function statusColor(k){ for(var i=0;i<STATUSES.length;i++){ if(STATUSES[i].k===k) return STATUSES[i].c; } return "var(--s-none)"; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]; }); }

  function weekStart(i){ // i is 1-based
    var d = new Date(state.start + "T00:00:00");
    d.setDate(d.getDate() + (i-1)*7);
    return d;
  }
  function fmt(d,opts){ return d.toLocaleDateString(undefined, opts || {day:"2-digit",month:"short"}); }
  function currentWeek(){
    var s = new Date(state.start+"T00:00:00"), now = new Date();
    var diff = Math.floor((now - s)/(7*86400000)) + 1;
    return (diff>=1 && diff<=WEEKS) ? diff : null;
  }
  function visibleWeeks(){
    if(state.view === "year") return {from:1, to:WEEKS};
    var q = parseInt(state.view.slice(1),10);
    return {from:(q-1)*13+1, to:q*13};
  }

  function filtered(){
    var p = $("fProgram").value, s = $("fStatus").value, per = $("fPerson").value;
    var q = ($("fSearch").value||"").toLowerCase();
    return state.projects.filter(function(x){
      if(p!=="all" && x.program!==p) return false;
      if(s!=="all" && x.status!==s) return false;
      if(per!=="all" && x.team.indexOf(per)<0 && x.lead!==per) return false;
      if(q && x.name.toLowerCase().indexOf(q)<0) return false;
      return true;
    });
  }

  // ---------- shared header builder ----------
  function headerHTML(win, leadLabel){
    var n = win.to - win.from + 1;
    var q = '<tr class="qband"><th class="stick">'+esc(leadLabel)+'</th>';
    var i, qi, run;
    if(state.view === "year"){
      for(qi=0; qi<4; qi++){
        q += '<th colspan="13" class="'+(qi%2?'alt':'')+'">Q'+(qi+1)+' &nbsp;'+
             fmt(weekStart(qi*13+1))+' - '+fmt(new Date(weekStart(qi*13+13).getTime()+6*86400000))+'</th>';
      }
    } else {
      q += '<th colspan="'+n+'">'+state.view.toUpperCase()+' &nbsp;'+
           fmt(weekStart(win.from))+' - '+fmt(new Date(weekStart(win.to).getTime()+6*86400000),{day:"2-digit",month:"short",year:"numeric"})+'</th>';
    }
    q += "</tr>";
    var h = '<tr><th class="stick">&nbsp;</th>';
    for(i=win.from;i<=win.to;i++){
      var d = weekStart(i);
      var label = state.view==="year" ? i : (d.getDate()+"/"+(d.getMonth()+1));
      h += '<th class="wkcell" title="Week '+i+' - '+fmt(d,{day:"2-digit",month:"short",year:"numeric"})+'">'+label+'</th>';
    }
    h += "</tr>";
    return "<thead>"+q+h+"</thead>";
  }

  function colgroup(win){
    var n = win.to-win.from+1, s = '<colgroup><col style="width:var(--lead)">';
    for(var i=0;i<n;i++) s += '<col class="wkcell">';
    return s + "</colgroup>";
  }

  // ---------- plan grid ----------
  function renderPlan(){
    var win = visibleWeeks(), rows = filtered();
    var html = '<table class="grid">' + colgroup(win) + headerHTML(win, "Project") + "<tbody>";
    if(!rows.length){
      html += '<tr><td class="stick">&nbsp;</td><td colspan="'+(win.to-win.from+1)+'"><div class="empty">No projects match these filters. Clear a filter, or add a project to start the plan.</div></td></tr>';
    }
    rows.forEach(function(p){
      var team = p.team.length ? p.team.join(", ") : "No one assigned";
      html += '<tr data-pid="'+p.id+'">';
      html += '<td class="stick"><button class="rowbtn" data-edit="'+p.id+'">'+
              '<span class="pname" title="'+esc(p.name)+'">'+esc(p.name)+'</span>'+
              '<span class="pmeta">'+esc(p.lead||"No lead")+' · '+esc(team)+'</span></button></td>';
      html += '<td class="barwrap" colspan="'+(win.to-win.from+1)+'" data-track="'+p.id+'"></td>';
      html += "</tr>";
    });
    html += "</tbody></table>";
    $("planGrid").innerHTML = html;
    positionBars(win, rows);
    drawToday("planGrid", win);
    renderLegend();
  }

  function positionBars(win, rows){
    var grid = $("planGrid");
    var n = win.to - win.from + 1;
    rows.forEach(function(p){
      var cell = grid.querySelector('[data-track="'+p.id+'"]');
      if(!cell) return;
      var s = Math.max(p.start, win.from), e = Math.min(p.end, win.to);
      if(e < s) return;
      var w = cell.getBoundingClientRect().width || (n*26);
      var unit = w / n;
      var left = (s - win.from) * unit;
      var width = (e - s + 1) * unit;
      var bar = document.createElement("div");
      bar.className = "bar";
      bar.tabIndex = 0;
      bar.setAttribute("role","button");
      bar.setAttribute("aria-label", p.name+", week "+p.start+" to "+p.end+", "+p.status);
      bar.style.left = left+"px";
      bar.style.width = Math.max(width-2,6)+"px";
      bar.style.background = statusColor(p.status);
      bar.dataset.pid = p.id;
      var pct = Math.max(0,Math.min(100,p.pct||0));
      bar.innerHTML = (pct>0 ? '<i class="fillpct" style="width:'+pct+'%"></i>' : '') +
        '<span class="lbl">'+(width>76 ? esc(p.status)+(pct?" · "+pct+"%":"") : "")+'</span>' +
        '<span class="handle l" data-h="l"></span><span class="handle r" data-h="r"></span>';
      cell.appendChild(bar);
    });
  }

  function drawToday(containerId, win){
    var cw = currentWeek();
    if(cw===null || cw<win.from || cw>win.to) return;
    var container = $(containerId);
    var head = container.querySelectorAll("thead tr")[1];
    if(!head) return;
    var th = head.children[cw - win.from + 1];
    if(!th) return;
    var tbody = container.querySelector("tbody");
    if(!tbody || !tbody.getBoundingClientRect().height) return;
    var cRect = container.getBoundingClientRect();
    var tRect = th.getBoundingClientRect(), bRect = tbody.getBoundingClientRect();
    var line = document.createElement("div");
    line.className = "today";
    line.style.left = (tRect.left - cRect.left + tRect.width/2) + "px";
    line.style.top = (bRect.top - cRect.top) + "px";
    line.style.height = bRect.height + "px";
    container.style.position = "relative";
    container.appendChild(line);
    var flag = document.createElement("div");
    flag.className = "todayflag";
    flag.textContent = "This week";
    flag.style.left = (tRect.left - cRect.left + tRect.width/2) + "px";
    flag.style.top = (bRect.top - cRect.top - 15) + "px";
    container.appendChild(flag);
  }

  // ---------- people grid ----------
  function loadFor(person, week){
    var n = 0;
    state.projects.forEach(function(p){
      if(p.team.indexOf(person)<0 && p.lead!==person) return;
      if(week>=p.start && week<=p.end) n++;
    });
    return n;
  }

  function renderPeople(){
    var win = visibleWeeks();
    var html = '<table class="grid">' + colgroup(win) + headerHTML(win, "Person") + "<tbody>";
    if(!state.people.length){
      html += '<tr><td class="stick">&nbsp;</td><td colspan="'+(win.to-win.from+1)+'"><div class="empty">No people yet. Open any project and add names to its team.</div></td></tr>';
    }
    state.people.forEach(function(person){
      var count = state.projects.filter(function(p){ return p.team.indexOf(person)>=0 || p.lead===person; }).length;
      html += '<tr><td class="stick"><span class="pname">'+esc(person)+'</span>'+
              '<span class="pmeta">'+count+(count===1?" project":" projects")+'</span></td>';
      for(var w=win.from; w<=win.to; w++){
        var n = loadFor(person, w);
        var cls = n>=3 ? "l3" : n===2 ? "l2" : n===1 ? "l1" : "";
        html += '<td class="wkcell"><div class="load '+cls+'" title="'+esc(person)+', week '+w+': '+n+'">'+(n||"")+'</div></td>';
      }
      html += "</tr>";
    });
    html += "</tbody></table>";
    $("peopleGrid").innerHTML = html;
    drawToday("peopleGrid", win);
  }

  function renderStats(){
    var live = state.projects.filter(function(p){ return p.status!=="Complete" && p.status!=="Not started"; }).length;
    var risk = state.projects.filter(function(p){ return p.status==="At risk" || p.status==="Off track"; }).length;
    var fte = state.projects.reduce(function(a,p){ return a + (parseFloat(p.fte)||0); },0);
    var cw = currentWeek();
    var over = 0;
    state.people.forEach(function(pe){ if(cw && loadFor(pe,cw)>=3) over++; });
    var items = [
      [state.projects.length,"projects on the plan"],
      [live,"in flight"],
      [risk,"at risk or off track"],
      [fte.toFixed(1),"FTE booked"],
      [state.people.length,"people"],
      [over,"stretched this week"]
    ];
    $("stats").innerHTML = items.map(function(i){
      return '<div class="stat"><b>'+i[0]+'</b><span>'+i[1]+'</span></div>'; }).join("");
  }

  function renderLegend(){
    $("legend").innerHTML = STATUSES.map(function(s){
      return '<span class="chip"><i class="sw" style="background:'+s.c+'"></i>'+s.k+'</span>';
    }).join("") + '<span class="chip" style="color:var(--mute)">The pale part of a bar is how much is done.</span>';
  }

  function renderRange(){
    var a = weekStart(1), b = new Date(weekStart(WEEKS).getTime()+6*86400000);
    $("rangeLbl").textContent = fmt(a,{day:"2-digit",month:"short",year:"numeric"}) + " to " + fmt(b,{day:"2-digit",month:"short",year:"numeric"});
  }

  function setWeekWidth(){
    var narrow = window.matchMedia("(max-width:640px)").matches;
    var w = state.view === "year" ? (narrow ? 20 : 26) : (narrow ? 34 : 46);
    document.documentElement.style.setProperty("--wk", w + "px");
  }

  function renderAll(){
    setWeekWidth();
    renderRange(); renderStats(); renderPlan(); renderPeople();
  }

  // ---------- filters & tabs ----------
  function opt(v,label,sel){ return '<option value="'+esc(v)+'"'+(sel?" selected":"")+'>'+esc(label)+'</option>'; }
  function fillFilters(){
    var keepP = $("fProgram").value || "all", keepS = $("fStatus").value || "all", keepPe = $("fPerson").value || "all";
    $("fProgram").innerHTML = opt("all","All") + PROGRAMS.map(function(p){ return opt(p,p,p===keepP); }).join("");
    $("fStatus").innerHTML  = opt("all","All") + STATUSES.map(function(s){ return opt(s.k,s.k,s.k===keepS); }).join("");
    $("fPerson").innerHTML  = opt("all","Everyone") + state.people.map(function(p){ return opt(p,p,p===keepPe); }).join("");
    $("fProgram").value = keepP; $("fStatus").value = keepS;
    $("fPerson").value = state.people.indexOf(keepPe)>=0 ? keepPe : "all";
  }
  function renderTabs(){
    var views = [["year","Full year"],["q1","Q1"],["q2","Q2"],["q3","Q3"],["q4","Q4"]];
    $("tabs").innerHTML = views.map(function(v){
      return '<button class="tab" data-view="'+v[0]+'" aria-pressed="'+(state.view===v[0])+'">'+v[1]+'</button>';
    }).join("");
  }

  // ---------- drag & resize ----------
  var drag = null;
  document.addEventListener("pointerdown", function(e){
    var bar = e.target.closest ? e.target.closest(".bar") : null;
    if(!bar) return;
    var p = state.projects.filter(function(x){ return x.id === +bar.dataset.pid; })[0];
    if(!p) return;
    var win = visibleWeeks();
    var track = bar.parentElement;
    var unit = track.getBoundingClientRect().width / (win.to-win.from+1);
    drag = {p:p, bar:bar, unit:unit, x0:e.clientX, s0:p.start, e0:p.end,
            mode: e.target.dataset.h === "l" ? "l" : e.target.dataset.h === "r" ? "r" : "move"};
    bar.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  document.addEventListener("pointermove", function(e){
    if(!drag) return;
    var steps = Math.round((e.clientX - drag.x0) / drag.unit);
    var p = drag.p;
    if(drag.mode === "move"){
      var len = drag.e0 - drag.s0;
      var ns = Math.min(Math.max(1, drag.s0 + steps), WEEKS - len);
      p.start = ns; p.end = ns + len;
    } else if(drag.mode === "l"){
      p.start = Math.min(Math.max(1, drag.s0 + steps), drag.e0);
    } else {
      p.end = Math.max(Math.min(WEEKS, drag.e0 + steps), drag.s0);
    }
    var win = visibleWeeks();
    var s = Math.max(p.start, win.from), en = Math.min(p.end, win.to);
    drag.bar.style.left = ((s - win.from) * drag.unit) + "px";
    drag.bar.style.width = Math.max((en - s + 1) * drag.unit - 2, 6) + "px";
  });
  document.addEventListener("pointerup", function(){
    if(!drag) return;
    drag = null;
    renderStats(); renderPlan(); renderPeople();
  });
  document.addEventListener("keydown", function(e){
    var bar = document.activeElement;
    if(!bar || !bar.classList || !bar.classList.contains("bar")) return;
    var p = state.projects.filter(function(x){ return x.id === +bar.dataset.pid; })[0];
    if(!p) return;
    var len = p.end - p.start;
    if(e.key === "ArrowRight" && p.end < WEEKS){ p.start++; p.end++; }
    else if(e.key === "ArrowLeft" && p.start > 1){ p.start--; p.end--; }
    else if(e.key === "Enter" || e.key === " "){ openDrawer(p.id); e.preventDefault(); return; }
    else return;
    e.preventDefault();
    renderStats(); renderPlan(); renderPeople();
  });

  // ---------- drawer ----------
  var editing = null;
  function openDrawer(id){
    var p = state.projects.filter(function(x){ return x.id===id; })[0];
    if(!p) return;
    editing = p;
    $("drawerTitle").textContent = p.name ? "Edit project" : "New project";
    $("eName").value = p.name;
    $("eProgram").innerHTML = PROGRAMS.map(function(x){ return opt(x,x,x===p.program); }).join("");
    $("eStatus").innerHTML = STATUSES.map(function(s){ return opt(s.k,s.k,s.k===p.status); }).join("");
    $("eLead").innerHTML = opt("","No lead",!p.lead) + state.people.map(function(x){ return opt(x,x,x===p.lead); }).join("");
    $("eStart").value = p.start; $("eEnd").value = p.end;
    $("ePct").value = p.pct; $("eFte").value = p.fte; $("eNotes").value = p.notes || "";
    renderTeamPicker();
    updateHint();
    $("scrim").classList.add("open"); $("drawer").classList.add("open");
    setTimeout(function(){ $("eName").focus(); }, 60);
  }
  function renderTeamPicker(){
    $("eTeam").innerHTML = state.people.map(function(x){
      var on = editing.team.indexOf(x)>=0;
      return '<button class="pick" data-person="'+esc(x)+'" aria-pressed="'+on+'">'+esc(x)+'</button>';
    }).join("") || '<span class="pcount">No people yet — add one below.</span>';
  }
  function updateHint(){
    var s = parseInt($("eStart").value,10)||1, e = parseInt($("eEnd").value,10)||1;
    s = Math.min(Math.max(s,1),WEEKS); e = Math.min(Math.max(e,s),WEEKS);
    $("dateHint").textContent = fmt(weekStart(s),{day:"2-digit",month:"short",year:"numeric"}) + " to " +
      fmt(new Date(weekStart(e).getTime()+6*86400000),{day:"2-digit",month:"short",year:"numeric"}) +
      "  ·  " + (e-s+1) + " weeks";
  }
  function closeDrawer(){
    $("scrim").classList.remove("open"); $("drawer").classList.remove("open"); editing = null;
  }
  function saveDrawer(){
    if(!editing) return;
    var s = Math.min(Math.max(parseInt($("eStart").value,10)||1,1),WEEKS);
    var e = Math.min(Math.max(parseInt($("eEnd").value,10)||s,s),WEEKS);
    editing.name = $("eName").value.trim() || "Untitled project";
    editing.program = $("eProgram").value;
    editing.status = $("eStatus").value;
    editing.lead = $("eLead").value;
    editing.start = s; editing.end = e;
    editing.pct = Math.min(Math.max(parseInt($("ePct").value,10)||0,0),100);
    editing.fte = parseFloat($("eFte").value)||0;
    editing.notes = $("eNotes").value;
    closeDrawer(); fillFilters(); renderAll();
  }

  // ---------- events ----------
  document.addEventListener("click", function(e){
    var t = e.target;
    if(t.closest && t.closest("[data-edit]")){ openDrawer(+t.closest("[data-edit]").dataset.edit); return; }
    if(t.classList.contains("tab")){
      state.view = t.dataset.view; setWeekWidth(); renderTabs(); renderPlan(); renderPeople(); return;
    }
    if(t.classList.contains("pick") && editing){
      var name = t.dataset.person, i = editing.team.indexOf(name);
      if(i>=0) editing.team.splice(i,1); else editing.team.push(name);
      renderTeamPicker(); return;
    }
  });
  $("closeDrawer").addEventListener("click", closeDrawer);
  $("scrim").addEventListener("click", closeDrawer);
  $("saveBtn").addEventListener("click", saveDrawer);
  $("deleteBtn").addEventListener("click", function(){
    if(!editing) return;
    state.projects = state.projects.filter(function(x){ return x.id !== editing.id; });
    closeDrawer(); renderAll();
  });
  $("eNewPerson").addEventListener("keydown", function(e){
    if(e.key !== "Enter") return;
    var name = this.value.trim();
    if(!name || state.people.indexOf(name)>=0){ this.value=""; return; }
    state.people.push(name);
    if(editing) editing.team.push(name);
    this.value = "";
    renderTeamPicker(); fillFilters();
    if(!editing) return;
    $("eLead").innerHTML = opt("","No lead",!editing.lead) + state.people.map(function(x){ return opt(x,x,x===editing.lead); }).join("");
  });
  ["eStart","eEnd"].forEach(function(id){ $(id).addEventListener("input", updateHint); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeDrawer(); });

  $("addBtn").addEventListener("click", function(){
    var cw = currentWeek() || 1;
    var p = {id:state.nextId++, name:"", program:PROGRAMS[0], lead:"", team:[], status:"Not started",
             start:cw, end:Math.min(cw+7,WEEKS), pct:0, fte:1, notes:""};
    state.projects.push(p);
    renderAll();
    openDrawer(p.id);
    $("drawerTitle").textContent = "New project";
  });
  $("planTitle").addEventListener("input", function(){ state.title = this.value; });
  $("startDate").addEventListener("change", function(){
    if(!this.value) return;
    state.start = this.value; renderAll();
  });
  ["fProgram","fStatus","fPerson"].forEach(function(id){ $(id).addEventListener("change", function(){ renderPlan(); }); });
  $("fSearch").addEventListener("input", function(){ renderPlan(); });
  $("printBtn").addEventListener("click", function(){ window.print(); });

  function download(name, text, type){
    var blob = new Blob([text], {type:type});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(url); }, 500);
  }
  $("exportBtn").addEventListener("click", function(){
    state.title = $("planTitle").value;
    download(state.title.replace(/[^\w\-]+/g,"_")+".json", JSON.stringify(state,null,2), "application/json");
  });
  $("csvBtn").addEventListener("click", function(){
    var head = ["Project","Program","Lead","Team","Status","Start week","End week","Start date","End date","% done","FTE","Notes"];
    var q = function(v){ return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'; };
    var lines = [head.map(q).join(",")];
    state.projects.forEach(function(p){
      lines.push([p.name,p.program,p.lead,p.team.join("; "),p.status,p.start,p.end,
        weekStart(p.start).toISOString().slice(0,10),
        new Date(weekStart(p.end).getTime()+6*86400000).toISOString().slice(0,10),
        p.pct,p.fte,p.notes].map(q).join(","));
    });
    download("portfolio_plan.csv", lines.join("\n"), "text/csv");
  });
  $("importBtn").addEventListener("click", function(){ $("fileIn").click(); });
  $("fileIn").addEventListener("change", function(){
    var f = this.files && this.files[0];
    if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var data = JSON.parse(r.result);
        if(!data || !Array.isArray(data.projects)) throw new Error("shape");
        state = data;
        state.nextId = state.nextId || (Math.max.apply(null, state.projects.map(function(p){return p.id;}).concat([0]))+1);
        $("planTitle").value = state.title || "Portfolio plan";
        $("startDate").value = state.start || "2026-09-07";
        renderTabs(); fillFilters(); renderAll();
      }catch(err){
        alert("That file isn't a plan this page can read. Open a JSON file saved from this planner.");
      }
    };
    r.readAsText(f);
    this.value = "";
  });

  var rt;
  window.addEventListener("resize", function(){ clearTimeout(rt); rt = setTimeout(function(){ setWeekWidth(); renderPlan(); renderPeople(); }, 150); });

  renderTabs(); fillFilters(); renderAll();
})();
</script>
